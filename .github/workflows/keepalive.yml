# Keeps the free Supabase project awake (it pauses after 7 days without use).
# Runs every 3 days and can be started by hand (Actions -> Supabase keep-alive -> Run workflow).
# Reads with the public key only - Row Level Security returns no patient data. A failed run = GitHub e-mail.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 1 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS --retry 3 --retry-delay 30 \
            "https://fifduhwrmkvdpdjxlewq.supabase.co/rest/v1/patients?select=id&limit=1" \
            -H "apikey: sb_publishable_2HXAhXF3gLyMw5xK3aMSDA_g9kWT0ik"
          echo " -> Supabase is awake"
