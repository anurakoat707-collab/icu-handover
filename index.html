<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta name="description" content="ICU Handover Dashboard - แบบส่งเวรผู้ป่วยวิกฤตแบบดิจิทัล (Prototype ข้อมูลสมมติ)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ICU Handover">
<title>ICU Handover</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="print.css">
</head>
<body>
<div class="demo-bar no-print" role="note">ข้อมูลกลางของวอร์ด · ใช้ชื่อย่อ + เตียง<span class="demo-more">&nbsp;· ไม่ใส่ข้อมูลเกินจำเป็น</span></div>

<div class="shell">
  <aside class="sidebar no-print" aria-label="เมนูหลัก">
    <a class="brand" href="#/home">
      <span class="brand-logo" aria-hidden="true"></span>
      <span class="brand-text"><b>ICU Handover</b><small>Digital Checklist</small></span>
    </a>
    <nav class="side-nav" id="side-nav"></nav>
    <a class="side-user" href="#/settings" id="side-user"></a>
  </aside>

  <div class="main">
    <header class="topbar no-print">
      <button type="button" class="icon-btn back-btn" id="back-btn" aria-label="ย้อนกลับ" hidden></button>
      <a class="brand brand-mobile" href="#/home"><span class="brand-logo" aria-hidden="true"></span><b>ICU Handover</b></a>
      <div class="top-title" id="top-title"></div>
      <div class="top-right">
        <span class="top-clock" id="top-clock"></span>
        <button type="button" class="sync-chip" id="sync-chip" hidden></button>
        <a class="avatar" id="top-avatar" href="#/settings" aria-label="ตั้งค่าผู้ใช้"></a>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="bottom-nav no-print" id="bottom-nav" aria-label="เมนูหลัก"></nav>

<dialog id="dialog" class="dialog"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div id="print-root"></div>

<script src="config.js"></script>
<script src="demo-data.js"></script>
<script src="store.js"></script>
<script src="cloud.js"></script>
<script src="validate.js"></script>
<script src="print.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
